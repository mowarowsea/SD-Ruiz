<!-- SD-Ruiz のアイコン。ピカソのバラ色の時代の配色で、先が一枚めくれた蕾の頭と、
     塗り重ねた斜めの胴。人にも花にも見えるシルエット。
     filter p で輪郭を揺らし、n で油彩っぽいノイズを乗せている。 -->
